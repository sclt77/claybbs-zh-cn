<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="md-post-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="55%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="md-post-glow" cx="50%" cy="50%" r="55%">
      <stop offset="55%" stop-color="#2563eb" stop-opacity="0"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity=".45"/>
    </radialGradient>
  </defs>
  <circle cx="60" cy="60" r="50" fill="url(#md-post-glow)">
    <animate attributeName="opacity" values="0.5;0.95;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 圆牌 -->
  <circle cx="60" cy="60" r="40" fill="url(#md-post-g)" stroke="#dbeafe" stroke-width="3"/>
  <!-- 旋转外刻度 -->
  <g style="transform-origin:60px 60px">
    <animateTransform attributeName="transform" type="rotate" from="0 60 60" to="360 60 60" dur="14s" repeatCount="indefinite"/>
    <circle cx="60" cy="60" r="46" fill="none" stroke="#93c5fd" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round" opacity=".75"/>
  </g>
  <!-- 对话气泡(发帖象征) -->
  <g fill="#fff">
    <rect x="40" y="46" width="40" height="26" rx="7"/>
    <path d="M50 72 l0 9 l9 -9 Z"/>
  </g>
  <g stroke="#3b82f6" stroke-width="3" stroke-linecap="round">
    <line x1="47" y1="55" x2="73" y2="55"/>
    <line x1="47" y1="62" x2="66" y2="62"/>
  </g>
  <!-- 飞出小光点 -->
  <circle cx="86" cy="40" r="2.6" fill="#bfdbfe">
    <animate attributeName="cy" values="44;36;44" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="34" cy="44" r="2" fill="#dbeafe">
    <animate attributeName="cy" values="48;40;48" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>
