<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="raw-glow" cx="50%" cy="50%" r="50%">
      <stop offset="64%" stop-color="#0c4a6e" stop-opacity="0"/>
      <stop offset="85%" stop-color="#22d3ee" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="raw-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="raw-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
  </defs>

  <circle cx="100" cy="100" r="94" fill="url(#raw-glow)">
    <animate attributeName="opacity" values="0.55;0.95;0.55" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- 主能量环 旋转 -->
  <g style="transform-origin:100px 100px">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="10s" repeatCount="indefinite"/>
    <circle cx="100" cy="100" r="86" fill="none" stroke="url(#raw-ring)" stroke-width="5" stroke-dasharray="44 20" stroke-linecap="round" filter="url(#raw-blur)" opacity=".85"/>
    <circle cx="100" cy="100" r="86" fill="none" stroke="url(#raw-ring)" stroke-width="2.6" stroke-dasharray="44 20" stroke-linecap="round"/>
  </g>

  <!-- 流动光点 -->
  <g>
    <circle cx="100" cy="14" r="3.6" fill="#cffafe">
      <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2.6;4.2;2.6" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="186" r="3" fill="#7dd3fc">
      <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2;3.6;2" dur="1.4s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 外细环反向 -->
  <g style="transform-origin:100px 100px">
    <animateTransform attributeName="transform" type="rotate" from="360 100 100" to="0 100 100" dur="16s" repeatCount="indefinite"/>
    <circle cx="100" cy="100" r="93" fill="none" stroke="#67e8f9" stroke-width="1.2" stroke-dasharray="2 8" stroke-linecap="round" opacity=".7"/>
  </g>
</svg>
