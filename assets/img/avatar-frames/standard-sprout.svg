<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="std-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="55%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <radialGradient id="std-glow" cx="50%" cy="50%" r="50%">
      <stop offset="68%" stop-color="#14532d" stop-opacity="0"/>
      <stop offset="88%" stop-color="#4ade80" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#16a34a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="100" cy="100" r="93" fill="url(#std-glow)">
    <animate attributeName="opacity" values="0.5;0.85;0.5" dur="3.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 主环 -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#std-ring)" stroke-width="4" stroke-linecap="round" opacity=".9"/>

  <!-- 旋转叶片装饰 -->
  <g style="transform-origin:100px 100px">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="18s" repeatCount="indefinite"/>
    <g fill="#4ade80">
      <path d="M100 6 q9 9 0 22 q-9 -13 0 -22 Z"/>
      <path d="M194 100 q-9 9 -22 0 q13 -9 22 0 Z" fill="#86efac"/>
      <path d="M100 194 q9 -9 0 -22 q-9 13 0 22 Z" fill="#22c55e"/>
      <path d="M6 100 q9 9 22 0 q-13 -9 -22 0 Z" fill="#86efac"/>
    </g>
  </g>

  <!-- 轻微闪烁露珠 -->
  <g fill="#dcfce7">
    <circle cx="150" cy="50" r="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="50" cy="150" r="1.8"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>
</svg>
